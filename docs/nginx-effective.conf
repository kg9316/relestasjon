# configuration file /etc/nginx/sites-enabled/tunnel-registry:
server {
    listen 80;
    listen [::]:80;
    server_name _;

location = /admin/devices {
    return 302 /admin/devices/;
}

location /admin/devices/ {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd_tunnel_registry;

    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
    location / {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd_tunnel_registry;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/tunnels {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd_tunnel_registry;

        proxy_pass http://127.0.0.1:8080/api/tunnels;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

